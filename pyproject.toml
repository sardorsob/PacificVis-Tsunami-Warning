[project]
name = "pacific-tsunami-warning-time"
version = "0.1.0"
description = "Reproducible analysis support for the Pacific Tsunami Warning Time visual story."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "arviz==1.3.0",
  "geopandas==1.1.4",
  "h5netcdf[h5py]==1.8.2",
  "marimo==0.24.0",
  "matplotlib==3.11.2",
  "mlflow-skinny==3.16.0",
  "nutpie==0.16.11",
  "preliz==0.28.0",
  "pymc==6.4.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
include = ["analysis", "pipeline", "scripts", "tests"]
exclude = ["data", "artifacts", "public"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
