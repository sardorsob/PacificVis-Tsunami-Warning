  <g id="text_30">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(93.6 66.236719)">Nine existing hour classes · line endpoints are extrema of stored vertices, not confidence intervals.</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(93.6 80.64)">No resampling, speed estimate, station arrival assignment or inference about bathymetric causes.</text>
  </g>
  <g id="text_31">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(23.4 464.993984)">Tōhoku 2011 · USGS origin 2011-03-11 05:46:24.120 UTC</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(23.4 478.196992)">Source: NOAA/NCEI published EPSG:4326 contours; accepted cache 2026-10-05. Source order: longitude, latitude.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(23.4 491.4)">Distances use WGS84 ellipsoid; no map projection. Tiny boundary roundoff is retained in source coordinates. Not a continuous-front envelope.</text>
  </g>
