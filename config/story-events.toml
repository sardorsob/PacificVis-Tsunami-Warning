# Events index, schema 2 (docs/data/demo-bundle.md). Bundle names are relative to --bundles-root;
# `names` is relative to this file's directory. Every development event of the released
# source_records table is configured; the builder lists those that pass the listing rule.
# Identities and magnitudes are the reviewed USGS values, copied once: origin, magnitude and
# magnitude type from config/ntwc-archive-batch-v2.toml (usgs_time, usgs_mag, usgs_magType);
# epicentre from the pinned USGS event detail. A test checks the copy; the builder reads neither.
default_event_id = "official20110311054624120_30"
names = "story-event-names.csv"
basemap = "basemap-v1/coastline.json"

