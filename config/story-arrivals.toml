# Story reported-times export (docs/data/story-arrivals.md). Paths are relative to --source-root.
# Every development event with at least one NTWC reported time or NCEI reported duration.
# Event identities are the reviewed USGS origins and epicentres, copied once: origin from
# config/ntwc-archive-batch-v2.toml (usgs_time); epicentre from the pinned USGS event detail
# (detail_path and detail_sha256 in config/ntwc-event-annotations-v2.csv); for an event with
# records also the records manifest event. A test checks the copy; the exporter reads neither source.
arrivals_bundle_id = "story-arrivals-v2"
release_manifest = "artifacts/releases/story-reported-times-v1.json"
bundles_root = "app/demo-public/data"

